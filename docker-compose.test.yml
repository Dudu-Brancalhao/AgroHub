# Disposable Postgres for the tier-2 persistence suite (research.md R-009).
#
# Separate from docker-compose.yml, and on a different host port, so a test run cannot touch a
# development database and does not clash with whatever else is bound to 5432.
#
#   docker compose -f docker-compose.test.yml up -d
#   npm --prefix backend run test:persistence
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agrohub
      POSTGRES_PASSWORD: agrohub
      POSTGRES_DB: agrohub_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrohub -d agrohub_test']
      interval: 3s
      timeout: 3s
      retries: 15
