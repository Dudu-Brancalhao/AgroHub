name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres for the integration-db and persistence suites.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrohub
          POSTGRES_PASSWORD: agrohub
          POSTGRES_DB: agrohub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrohub -d agrohub_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://agrohub:agrohub@localhost:5432/agrohub_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db:migrate
      - run: npm run test:all

  frontend:
    name: Frontend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agrohub-api ./backend
