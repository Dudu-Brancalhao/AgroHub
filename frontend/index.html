<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroHub</title>
    <meta name="description" content="Cadastro de produtores rurais, propriedades e safras." />

    <!--
      A flor do BrandIcon, servida de public/ e referenciada pela raiz.

      SVG em vez de .ico: e o mesmo caminho que o cabecalho desenha, escala sem borrar em
      qualquer densidade de tela e acompanha o tema claro/escuro do navegador. O `sizes="any"`
      diz ao navegador que este arquivo serve para todos os tamanhos, senao alguns ainda pedem
      /favicon.ico e registram um 404 no console.
    -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <meta name="theme-color" content="#008531" />

    <!--
      Poppins, nos três pesos que o tema usa (400, 500, 600).
      `display=swap` para o texto aparecer no fallback enquanto a fonte carrega, em vez de
      deixar a tela em branco.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
